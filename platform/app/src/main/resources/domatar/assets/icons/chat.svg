<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Chat">
  <defs>
    <linearGradient id="chtbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#chtbg)"/>
  <!-- Speech bubble body -->
  <rect x="10" y="12" width="40" height="30" rx="8" fill="#ffffff"/>
  <!-- Tail -->
  <polygon points="16,42 10,52 26,42" fill="#ffffff"/>
  <!-- Dots -->
  <circle cx="22" cy="27" r="3" fill="#7c3aed"/>
  <circle cx="32" cy="27" r="3" fill="#7c3aed"/>
  <circle cx="42" cy="27" r="3" fill="#7c3aed"/>
</svg>
