  <rect x="2" y="9.5" width="12" height="4.5" rx="1" fill="none" stroke="#7c3aed" stroke-width="1.4"/>
  <circle cx="12" cy="4.25"  r="1" fill="#7c3aed"/>
  <circle cx="12" cy="11.75" r="1" fill="#7c3aed"/>
