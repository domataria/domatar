<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Photos">
  <defs>
    <linearGradient id="phbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#phbg)"/>
  <!-- Camera body -->
  <rect x="10" y="22" width="44" height="28" rx="5" ry="5" fill="#ffffff" opacity=".95"/>
  <!-- Viewfinder bump -->
  <rect x="22" y="16" width="20" height="10" rx="4" ry="4" fill="#ffffff" opacity=".95"/>
  <!-- Lens outer ring -->
  <circle cx="32" cy="36" r="9" fill="#f59e0b"/>
  <!-- Lens inner -->
  <circle cx="32" cy="36" r="5.5" fill="#ffffff" opacity=".9"/>
  <!-- Flash dot -->
  <circle cx="44" cy="27" r="2.5" fill="#f59e0b"/>
</svg>
