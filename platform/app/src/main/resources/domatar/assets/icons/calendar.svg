<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Calendar">
  <defs>
    <linearGradient id="calbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#calbg)"/>
  <!-- Calendar body -->
  <rect x="10" y="16" width="44" height="36" rx="4" ry="4" fill="#ffffff" opacity=".95"/>
  <!-- Header bar -->
  <rect x="10" y="16" width="44" height="12" rx="4" ry="4" fill="#1d4ed8"/>
  <rect x="10" y="22" width="44" height="6" fill="#1d4ed8"/>
  <!-- Binding rings -->
  <rect x="20" y="12" width="4" height="10" rx="2" fill="#ffffff"/>
  <rect x="40" y="12" width="4" height="10" rx="2" fill="#ffffff"/>
  <!-- Grid dots (3x3) -->
  <circle cx="20" cy="37" r="2.5" fill="#2563eb"/>
  <circle cx="32" cy="37" r="2.5" fill="#2563eb"/>
  <circle cx="44" cy="37" r="2.5" fill="#2563eb"/>
  <circle cx="20" cy="46" r="2.5" fill="#2563eb"/>
  <circle cx="32" cy="46" r="2.5" fill="#2563eb"/>
  <circle cx="44" cy="46" r="2.5" fill="#2563eb" opacity=".4"/>
</svg>
