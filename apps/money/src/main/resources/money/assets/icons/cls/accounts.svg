<?xml version="1.0" encoding="UTF-8"?>
<!-- Money accounts container: stack of account cards -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Accounts">
  <!-- Back card -->
  <rect x="3" y="2" width="11" height="7" rx="1.5"
        fill="#d97706" opacity="0.4"/>
  <!-- Middle card -->
  <rect x="2" y="4" width="11" height="7" rx="1.5"
        fill="#d97706" opacity="0.6"/>
  <!-- Front card -->
  <rect x="1" y="6" width="11" height="7" rx="1.5"
        fill="#b45309"/>
  <!-- Balance stripe -->
  <rect x="3" y="10" width="6" height="1.5" rx="0.5"
        fill="#fde68a" opacity="0.8"/>
</svg>
