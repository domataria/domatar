<?xml version="1.0" encoding="UTF-8"?>
<!-- Money account: single card with balance indicator -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Account">
  <!-- Card -->
  <rect x="1" y="3" width="14" height="10" rx="1.5"
        fill="#b45309"/>
  <!-- Chip -->
  <rect x="2.5" y="5" width="3.5" height="2.5" rx="0.5"
        fill="#fde68a" opacity="0.9"/>
  <!-- Balance line -->
  <rect x="2.5" y="9.5" width="8" height="1.5" rx="0.5"
        fill="#fde68a" opacity="0.7"/>
</svg>
