<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Mail">
  <defs>
    <linearGradient id="mlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#mlbg)"/>
  <!-- Envelope body -->
  <rect x="10" y="18" width="44" height="30" rx="4" fill="#ffffff"/>
  <!-- Envelope flap (V shape) -->
  <polyline points="10,18 32,36 54,18" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
</svg>
