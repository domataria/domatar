     width="16" height="16" role="img" aria-label="Logs">
  <rect x="2" y="1" width="12" height="14" rx="1.5" fill="#6366f1"/>
  <line x1="5" y1="5"   x2="11" y2="5"   stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="5" y1="8"   x2="11" y2="8"   stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="5" y1="11"  x2="9"  y2="11"  stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
</svg>
