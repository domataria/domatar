<?xml version="1.0" encoding="UTF-8"?>
<!-- Single quip row: speech bubble -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Quip">
  <rect x="1" y="2" width="14" height="9" rx="2" fill="#16a34a"/>
  <!-- Tail -->
  <polygon points="3,11 1,15 7,11" fill="#16a34a"/>
  <!-- Text lines -->
  <line x1="4" y1="5" x2="12" y2="5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="4" y1="7.5" x2="9"  y2="7.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
