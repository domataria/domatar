<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon for the Sovevos Navigator app.

  Used by Desktop's app catalog (Spec-Navigator.txt PART 11.1) and
  shipped alongside the other Sovevos app icons in src/main/webapp/icons/.
  Shape: a stylised file-manager / tree glyph - a vertical spine with
  three branches, suggesting a hierarchy - on a rounded-square tile so
  it lines up visually with quippin.svg and login.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Navigator">
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#nbg)"/>

  <!-- Vertical spine -->
  <line x1="20" y1="14" x2="20" y2="50"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Three horizontal branches -->
  <line x1="20" y1="20" x2="30" y2="20"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="32" x2="30" y2="32"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="20" y1="44" x2="30" y2="44"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Folder rects at branch tips -->
  <rect x="30" y="14" width="16" height="12" rx="2" ry="2" fill="#ffffff"/>
  <rect x="30" y="26" width="16" height="12" rx="2" ry="2" fill="#ffffff" opacity=".85"/>
  <rect x="30" y="38" width="16" height="12" rx="2" ry="2" fill="#ffffff" opacity=".7"/>
</svg>
