<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Bookstore">
  <defs>
    <linearGradient id="bsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bsbg)"/>
  <!-- Spine -->
  <rect x="18" y="13" width="5" height="38" rx="2" fill="#ffffff"/>
  <!-- Pages (right block) -->
  <rect x="23" y="13" width="22" height="38" rx="2" fill="#ffffff" opacity=".85"/>
  <!-- Page lines -->
  <line x1="27" y1="22" x2="41" y2="22" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="29" x2="41" y2="29" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="36" x2="41" y2="36" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
  <line x1="27" y1="43" x2="36" y2="43" stroke="#0d9488" stroke-width="2" stroke-linecap="round"/>
</svg>
