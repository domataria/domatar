<?xml version="1.0" encoding="UTF-8"?>
<!-- Book for sale: book with a small price tag -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Listing">
  <!-- Spine -->
  <rect x="1" y="2" width="3" height="11" rx="1" fill="#0d9488"/>
  <!-- Pages block -->
  <rect x="4" y="2" width="7" height="11" rx="1" fill="#0d9488" opacity=".65"/>
  <!-- Text lines -->
  <line x1="6" y1="5"   x2="9"  y2="5"   stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <line x1="6" y1="7"   x2="9"  y2="7"   stroke="#fff" stroke-width="1" stroke-linecap="round"/>
  <!-- Price tag (top-right) -->
  <rect x="9" y="1" width="6" height="5" rx="1" fill="#f59e0b"/>
  <line x1="10.5" y1="3.5" x2="13.5" y2="3.5" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
</svg>
