<?xml version="1.0" encoding="UTF-8"?>
<!-- Single desktop app row: rounded square with launch arrow -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="App">
  <rect x="2" y="2" width="12" height="12" rx="2.5" fill="#0891b2"/>
  <!-- Launch arrow -->
  <polyline points="6,10 10,6 10,9" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="7" y1="9" x2="10" y2="6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
</svg>
