<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Desktop">
  <defs>
    <linearGradient id="dtbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#dtbg)"/>
  <!-- Monitor screen bezel -->
  <rect x="10" y="12" width="44" height="30" rx="3" ry="3" fill="#ffffff" opacity=".9"/>
  <!-- Screen inner (slightly inset) -->
  <rect x="13" y="15" width="38" height="24" rx="2" ry="2" fill="#475569" opacity=".6"/>
  <!-- Stand stem -->
  <rect x="29" y="42" width="6" height="7" rx="1" fill="#ffffff" opacity=".9"/>
  <!-- Stand base -->
  <rect x="20" y="48" width="24" height="4" rx="2" fill="#ffffff" opacity=".9"/>
</svg>
