<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon for the Sovevos Login (identity hub) app.

  Used by Desktop's app catalog (Spec-Desktop.txt PART 8) and the
  Login app's manage page. Shape: a stylised key, signalling identity
  / sign-in / credentials, on a rounded-square tile so it lines up
  visually with other Sovevos app icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Account">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Key bow -->
  <circle cx="22" cy="32" r="9" fill="none" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="22" cy="32" r="2.4" fill="#ffffff"/>

  <!-- Key shaft -->
  <rect x="31" y="30.4" width="22" height="3.2" fill="#ffffff"/>

  <!-- Teeth -->
  <rect x="46" y="33.6" width="3.2" height="6"   fill="#ffffff"/>
  <rect x="51" y="33.6" width="3.2" height="4"   fill="#ffffff"/>
</svg>
