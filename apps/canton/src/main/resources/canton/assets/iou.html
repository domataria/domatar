<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iou</title>

    <link rel="stylesheet" href="../domatar.css"/>

    <style>
        .cn-header      { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
        .cn-header h2   { margin: 0; }
        .cn-back        { font-size: 0.88em; }
        .cn-card        { border: 1px solid var(--border); border-radius: var(--radius);
                          padding: 16px 20px; margin-bottom: 20px; max-width: 760px; }
        .cn-card h3     { margin: 0 0 12px; font-size: 1.05em; }
        .cn-dl          { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; }
        .cn-dl dt       { font-size: 0.82em; font-weight: 600; color: var(--page-muted); }
        .cn-dl dd       { margin: 0; word-break: break-word; }
        .cn-alloc       { width: 100%; border-collapse: collapse; }
        .cn-alloc th, .cn-alloc td { text-align: left; padding: 3px 8px 3px 0; }
        .cn-alloc th    { font-size: 0.78em; color: var(--page-muted); }
        .cn-row         { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .cn-row label   { font-size: 0.82em; font-weight: 600; color: var(--page-muted); }
        .cn-row input   { padding: 6px 9px; border: 1px solid var(--border);
                          border-radius: var(--radius); font-size: 0.95em; width: 100%;
                          box-sizing: border-box; }
        .cn-btns        { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .cn-error       { color: var(--danger, #dc2626); font-size: 0.9em;
                          margin-bottom: 10px; min-height: 1.2em; }
        .cn-ok          { color: #15803d; font-size: 0.9em; margin-top: 8px; }
    </style>
</head>
<body>

<script type="text/javascript" src="../jquery-3.5.1.js"></script>
<script type="text/javascript" src="../quip.js"></script>

<script type="text/javascript">

    var contractDomId = '';

    function failed(ret)
    {
        return !ret || ret.Error === 'Failure';
    }

    function errText(ret, fallback)
    {
        return (ret && ret.ErrorMsg) ? ret.ErrorMsg : fallback;
    }

    function showError(msg)
    {
        $('#page-error').text(msg || '');
        $('#page-ok').text('');
    }

    function showOk(msg)
    {
        $('#page-error').text('');
        $('#page-ok').text(msg || '');
    }

    function field(attrs, name)
    {
        return (attrs && attrs[name] != null) ? String(attrs[name]) : '';
    }

    function loadIou()
    {
        if (!contractDomId)
        {
            showError('Missing ContractDomId.');
            return;
        }

        $.ajax({
            type: 'GET',
            url: 'Wui/IouWui',
            data: 'Action=GetIou&ContractDomId=' + encodeURIComponent(contractDomId),
            cache: false,
            timeout: 30000,
            success: function(json)
            {
                var ret = JSON.parse(json);
                if (failed(ret))
                {
                    showError(errText(ret, 'Failed to load Iou.'));
                    return;
                }
                renderIou(ret.Attrs || {});
            },
            error: function(jqXHR, textStatus)
            {
                showError('Network error: ' + textStatus);
            }
        });
    }

    function renderIou(attrs)
    {
        var preferred = [
            'ContractId', 'TemplateId', 'Name', 'Symbol', 'InstrumentId',
            'InstrumentAdmin', 'Issuer', 'Owner', 'Buyer', 'Receiver', 'Sender',
            'Operator', 'Amount', 'Par', 'Currency', 'Nav', 'AsOf',
            'Constituents', 'Allocations', 'Yield', 'Underlying', 'WamDays',
            'Collateral', 'Rate', 'Start', 'End', 'Status', 'LockContext',
            'LockExpiry', 'Signatories', 'Observers'
        ];
        var seen = {};
        var keys = [];
        preferred.forEach(function(k)
        {
            if (attrs[k] != null && String(attrs[k]) !== '' && !seen[k])
            {
                seen[k] = true;
                keys.push(k);
            }
        });
        Object.keys(attrs).sort().forEach(function(k)
        {
            if (k === 'PackageId' && !attrs[k])
                return;
            if (attrs[k] != null && String(attrs[k]) !== '' && !seen[k])
            {
                seen[k] = true;
                keys.push(k);
            }
        });

        var html = '';
        keys.forEach(function(k)
        {
            html += '<dt>' + escapeHtml(k) + '</dt><dd>' + formatAttr(k, attrs[k]) + '</dd>';
        });
        $('#attr-list').html(html || '<dt></dt><dd class="cn-hint">No attributes.</dd>');
        var title = field(attrs, 'Name') || field(attrs, 'Symbol') || 'Contract';
        $('#page-title').text(title);
        document.title = title;
    }

    function formatAttr(name, raw)
    {
        var value = String(raw);
        if (name === 'Allocations' || (value.charAt(0) === '[' && value.indexOf('"Name"') >= 0))
        {
            try
            {
                var rows = JSON.parse(value);
                if (Array.isArray(rows) && rows.length && rows[0].Name != null)
                {
                    var t = '<table class="cn-alloc"><thead><tr><th>Name</th><th>Weight</th></tr></thead><tbody>';
                    rows.forEach(function(r)
                    {
                        t += '<tr><td>' + escapeHtml(r.Name) + '</td><td>'
                            + escapeHtml(String(r.Weight)) + '</td></tr>';
                    });
                    t += '</tbody></table>';
                    return t;
                }
            }
            catch (e) { /* fall through */ }
        }
        return escapeHtml(value);
    }

    function escapeHtml(s)
    {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function postChoice(action, extra)
    {
        if (!contractDomId)
        {
            showError('Missing ContractDomId.');
            return;
        }

        showError('');
        var data = 'Action=' + encodeURIComponent(action)
            + '&ContractDomId=' + encodeURIComponent(contractDomId);
        if (extra)
            data += extra;

        $.ajax({
            type: 'POST',
            url: 'Wui/IouWui',
            data: data,
            cache: false,
            timeout: 30000,
            success: function(json)
            {
                var ret = JSON.parse(json);
                if (failed(ret))
                {
                    showError(errText(ret, action + ' failed.'));
                    return;
                }
                window.location.href = '/domatar/canton/canton.html';
            },
            error: function(jqXHR, textStatus)
            {
                showError('Network error: ' + textStatus);
            }
        });
    }

    function transferIou()
    {
        var newOwner = $.trim($('#new-owner').val());
        if (!newOwner)
        {
            showError('NewOwner is required.');
            return;
        }
        postChoice('Transfer', '&NewOwner=' + encodeURIComponent(newOwner));
    }

    function settleIou()
    {
        if (!window.confirm('Settle this Iou?'))
            return;
        postChoice('Settle');
    }

    function archiveIou()
    {
        if (!window.confirm('Archive this Iou?'))
            return;
        postChoice('Archive');
    }

    $(document).ready(function()
    {
        var params = new URLSearchParams(window.location.search);
        contractDomId = params.get('ContractDomId') || '';
        loadIou();
    });

</script>

<div class="page">
    <div class="page-content">
        <div class="cn-header">
            <h2 id="page-title">Contract</h2>
            <a class="cn-back" href="/domatar/canton/canton.html">&larr; Active</a>
        </div>

        <div id="page-error" class="cn-error"></div>
        <div id="page-ok" class="cn-ok"></div>

        <div class="cn-card">
            <h3>Contract</h3>
            <dl class="cn-dl" id="attr-list"></dl>
        </div>

        <div class="cn-card">
            <h3>Choices</h3>
            <div class="cn-row">
                <label for="new-owner">NewOwner</label>
                <input type="text" id="new-owner" placeholder="hint::1220&hellip;" maxlength="255"/>
            </div>
            <div class="cn-btns">
                <button type="button" onclick="transferIou()">Transfer</button>
                <button type="button" onclick="settleIou()">Settle</button>
                <button type="button" onclick="archiveIou()">Archive</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
