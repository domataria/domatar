<?xml version="1.0" encoding="UTF-8"?>
<!-- Spreadsheet sheet: single sheet with grid -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Sheet">
  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="13" height="13" rx="1.5"
        fill="#f0fdf4" stroke="#15803d" stroke-width="1.3"/>
  <!-- Header row -->
  <rect x="1.5" y="1.5" width="13" height="3.5" rx="1.5"
        fill="#15803d" opacity="0.85"/>
  <!-- Vertical divider -->
  <line x1="7"   y1="5" x2="7"   y2="14.5" stroke="#15803d" stroke-width="0.9" opacity="0.55"/>
  <!-- Horizontal dividers -->
  <line x1="1.5" y1="9"  x2="14.5" y2="9"  stroke="#15803d" stroke-width="0.9" opacity="0.55"/>
  <line x1="1.5" y1="12" x2="14.5" y2="12" stroke="#15803d" stroke-width="0.9" opacity="0.55"/>
</svg>
