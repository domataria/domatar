<?xml version="1.0" encoding="UTF-8"?>
<!-- Spreadsheet sheets container: mini spreadsheet grid -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"
     width="16" height="16" role="img" aria-label="Sheets">
  <!-- Outer border -->
  <rect x="1.5" y="1.5" width="13" height="13" rx="1.5"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <!-- Header row (col labels) -->
  <rect x="1.5" y="1.5" width="13" height="3.5" rx="1.5"
        fill="#16a34a" opacity="0.75"/>
  <!-- Vertical dividers -->
  <line x1="6.5"  y1="5" x2="6.5"  y2="14.5" stroke="#16a34a" stroke-width="0.9" opacity="0.5"/>
  <line x1="11"   y1="5" x2="11"   y2="14.5" stroke="#16a34a" stroke-width="0.9" opacity="0.5"/>
  <!-- Horizontal divider -->
  <line x1="1.5"  y1="9.5" x2="14.5" y2="9.5" stroke="#16a34a" stroke-width="0.9" opacity="0.5"/>
</svg>
