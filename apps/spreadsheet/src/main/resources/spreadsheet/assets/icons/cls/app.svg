<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="Spreadsheet">
  <defs>
    <linearGradient id="ssbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#ssbg)"/>
  <!-- Grid outline -->
  <rect x="12" y="12" width="40" height="40" rx="3" fill="#ffffff" opacity=".15"/>
  <!-- Column header -->
  <rect x="12" y="12" width="40" height="10" rx="3" fill="#ffffff" opacity=".9"/>
  <!-- Row header -->
  <rect x="12" y="22" width="12" height="30" rx="0" fill="#ffffff" opacity=".7"/>
  <!-- Grid cells -->
  <rect x="24" y="22" width="28" height="30" rx="0" fill="#ffffff" opacity=".35"/>
  <!-- Grid lines vertical -->
  <line x1="36" y1="22" x2="36" y2="52" stroke="#16a34a" stroke-width="1.5"/>
  <!-- Grid lines horizontal -->
  <line x1="24" y1="32" x2="52" y2="32" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="24" y1="42" x2="52" y2="42" stroke="#16a34a" stroke-width="1.5"/>
</svg>
