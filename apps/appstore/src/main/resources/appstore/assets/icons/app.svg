<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"
     width="64" height="64" role="img" aria-label="App Store">
  <defs>
    <linearGradient id="asbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#asbg)"/>
  <!-- 2x2 grid of app tiles -->
  <rect x="11" y="11" width="18" height="18" rx="4" ry="4" fill="#ffffff" opacity=".95"/>
  <rect x="35" y="11" width="18" height="18" rx="4" ry="4" fill="#ffffff" opacity=".85"/>
  <rect x="11" y="35" width="18" height="18" rx="4" ry="4" fill="#ffffff" opacity=".85"/>
  <rect x="35" y="35" width="18" height="18" rx="4" ry="4" fill="#ffffff" opacity=".7"/>
</svg>
