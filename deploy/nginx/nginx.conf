events {}

http {
    # Docker embedded DNS (re-resolve upstreams when Tomcat containers are recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ----------------------------------------------------------------
    # sovevos.quippin.com  ->  tomcat1:8080  (prv1)
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name sovevos.quippin.com;

        location / {
            set                $tomcat_upstream  tomcat1;
            proxy_pass         http://$tomcat_upstream:8080/sovevos$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Accept-Encoding   "";

            sub_filter         '/sovevos/' '/';
            sub_filter_once    off;
            sub_filter_types   text/html text/javascript application/javascript text/css;

            proxy_redirect     ~^(https?://[^/]+)/sovevos/(.*)$ $1/$2;
        }
    }

    # ----------------------------------------------------------------
    # sovevos.avatarvia.com  ->  tomcat2:8080  (prv2)
    # Strips the /quippin context prefix so URLs look like /desktop
    # instead of /quippin/desktop.
    # ----------------------------------------------------------------
    server {
        listen 80;
        server_name sovevos.avatarvia.com;

        location / {
            set                $tomcat_upstream  tomcat2;
            proxy_pass         http://$tomcat_upstream:8080/sovevos$request_uri;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Accept-Encoding   "";

            sub_filter         '/sovevos/' '/';
            sub_filter_once    off;
            sub_filter_types   text/html text/javascript application/javascript text/css;

            proxy_redirect     ~^(https?://[^/]+)/sovevos/(.*)$ $1/$2;
        }
    }
}
